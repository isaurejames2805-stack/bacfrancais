      { id: "contexte", label: "Contexte & auteur", couleur: C.turquoise, blocks: [
        { sub: "Rimbaud, l'ado génie", text: "Né à Charleville (Ardennes), élève brillant mais révolté, Rimbaud étouffe dans sa ville et sa famille. En 1870, à 16 ans, il fait plusieurs fugues et confie ses poèmes à son professeur Izambard puis à Paul Demeny, à Douai. Il abandonnera la poésie très jeune pour partir vivre à l'étranger." },
        { sub: "Le poète « voyant »", text: "Dans sa célèbre « lettre du voyant », Rimbaud écrit « Je est un autre » : il veut devenir voyant par un « dérèglement de tous les sens », c'est-à-dire tout ressentir pour inventer une poésie neuve." },

      { id: "resume", label: "L'essentiel", couleur: C.bleu, blocks: [

        { callout: "Astuce : les 8 poèmes marqués ⭐ dans l'onglet « Les 22 poèmes » sont les plus utiles à préparer en priorité." }

      { id: "analyse", label: "Analyse de l'œuvre", couleur: C.violet, blocks: [
        { sub: "Le projet", text: "À 16 ans, Rimbaud écrit un premier ensemble qui est déjà une déclaration d'indépendance. Ce n'est pas un recueil vraiment prévu (des poèmes confiés à Demeny), mais lus ensemble, ils dessinent une trajectoire : partir d'une poésie apprise à l'école pour aller vers une voix personnelle." },
        { sub: "Une unité malgré la diversité", text: "Les tons sont très variés (tendre, satirique, macabre, joyeux), mais un même mouvement les relie : un « je » qui refuse (la famille, l'Église, l'Empire, l'ordre bourgeois) et un « je » qui désire (la nature, la route, le corps, la liberté). Ce sont les deux visages de l'émancipation : s'arracher à… et s'élancer vers…" },
        { sub: "Le corps et les sens au centre", text: "La poésie de Rimbaud passe par les sensations : la faim, le froid, la fatigue, le plaisir. Le corps devient un instrument de connaissance (l'idée du « voyant »). La nature n'est jamais un simple décor : elle est partenaire, mère, amante — et parfois complice, quand elle cache l'horreur (Le Dormeur du val)." },
        { sub: "L'ironie, sa modernité", text: "Il mélange les registres : l'alexandrin noble et des mots triviaux, des exclamations orales (« Oh ! là là ! »), de l'autodérision (Roman, Ma Bohème). Ce mélange, choquant pour l'époque, est sa modernité : il « désacralise » la poésie pour la rendre vivante." },
        { sub: "Ce qu'il faut avoir compris", text: "Le recueil parle moins de 22 sujets différents que d'un geste unique : un adolescent qui conquiert sa liberté en écrivant, et qui invente en chemin une poésie qui n'obéit plus aux règles. C'est exactement le sens du parcours." }

        { cite: "On n'est pas sérieux, quand on a dix-sept ans.", ref: "Roman", exp: "Rimbaud se moque tendrement de l'adolescence et de ses premières amours : légèreté et autodérision." },

    poemes: [
      { n: 1, t: "Première soirée", f: "8 quatrains d'octosyllabes", r: "Scène de séduction badine : une jeune fille à demi dévêtue, un jeu amoureux léger et malicieux.", a: "Rimbaud renouvelle la poésie amoureuse : sensualité heureuse, ton complice et ironique." },
      { n: 2, t: "Sensation", f: "2 quatrains d'alexandrins", r: "Le poète rêve d'une promenade au crépuscule, pieds nus dans l'herbe, sans parler, simplement heureux.", a: "Manifeste de la poésie des sens : sentir, pas réfléchir. La nature est presque une amante.", imp: true, plus: "Le futur (« j'irai ») en fait un projet d'évasion, une promesse qu'il se fait à lui-même. Rimbaud fait de la sensation le point de départ de la poésie et fond le corps dans la nature (« heureux comme avec une femme »). Un poème-programme sur la liberté.", cite: "Par les soirs bleus d'été, j'irai dans les sentiers" },

      { n: 7, t: "Le Châtiment de Tartufe", f: "sonnet", r: "Un faux dévot (le Tartuffe de Molière) est démasqué et puni.", a: "Satire de l'hypocrisie religieuse ; Rimbaud attaque la fausse dévotion." },
      { n: 8, t: "Vénus Anadyomène", f: "sonnet d'alexandrins", r: "Au lieu de la belle déesse sortant des eaux, une femme laide et grasse sort d'une baignoire.", a: "Anti-blason provocateur : la laideur crue contre l'idéal du beau.", imp: true, plus: "Rimbaud détruit un mythe classique de la beauté et renverse le blason traditionnel (poème qui vante le corps féminin). La provocation, le réalisme cru et le rejet des codes du Parnasse en font un poème clé de l'émancipation esthétique.", cite: "« Clara Venus » gravé sur la chute des reins" },
      { n: 9, t: "Les Reparties de Nina", f: "dialogue", r: "Le poète propose à Nina une longue escapade amoureuse à la campagne ; elle répond froidement.", a: "Contraste entre le rêve du poète et la réalité prosaïque : chute ironique." },
      { n: 10, t: "À la Musique", f: "alexandrins", r: "Sur une place de Charleville, la bourgeoisie parade au concert ; le poète, débraillé, l'observe et s'en moque.", a: "Satire féroce de la bourgeoisie (bête, suffisante) ; le poète se pose en marginal.", imp: true, plus: "Opposition nette entre le poète en marge et les bourgeois ridicules. La critique sociale est mordante : Rimbaud affiche son émancipation par sa tenue et son regard moqueur.", cite: "Moi, je suis débraillé comme un étudiant" },

      { n: 12, t: "Roman", f: "8 sizains d'octosyllabes", r: "Un soir d'été, un ado de dix-sept ans tombe amoureux ; légèreté des premières amours.", a: "Autoportrait ironique de l'adolescence : insouciance et autodérision.", imp: true, plus: "Le titre « Roman » et la construction en scènes racontent une petite histoire. Rimbaud se moque gentiment de lui-même et peint l'ivresse des dix-sept ans : l'émancipation passe aussi par le sentiment.", cite: "On n'est pas sérieux, quand on a dix-sept ans." },
      { n: 13, t: "Morts de Quatre-vingt-douze…", f: "sonnet", r: "Défense des morts révolutionnaires de 1792 contre ceux qui les récupèrent.", a: "Engagement républicain : hommage aux révolutionnaires, contre l'Empire." },
      { n: 14, t: "Le Mal", f: "sonnet", r: "Pendant que la guerre massacre les soldats, Dieu reste indifférent et se réjouit des offrandes des riches.", a: "Double critique : la guerre absurde ET une religion complice.", imp: true, plus: "Rimbaud dénonce d'un même geste la guerre de 1870 et l'hypocrisie de l'Église, qui bénit les massacres pendant que la mère pauvre pleure. Poème de révolte anticléricale.", cite: "Il est un Dieu qui rit aux nappes damassées" },
      { n: 15, t: "Rages de Césars", f: "sonnet", r: "Napoléon III vaincu et prisonnier ressasse ses rêves de gloire perdus.", a: "Satire politique : portrait pathétique de l'empereur déchu après Sedan." },
      { n: 16, t: "Rêvé pour l'hiver", f: "sonnet", r: "Le poète imagine un voyage en train, l'hiver, dans un wagon rose, avec une amoureuse.", a: "Rêverie tendre et sensuelle : intimité, douceur, évasion." },
      { n: 17, t: "Le Dormeur du val", f: "sonnet d'alexandrins", r: "Un jeune soldat semble dormir dans un décor de nature paisible… la fin révèle qu'il est mort.", a: "Contraste saisissant beauté / horreur : la guerre dénoncée par un effet de chute.", imp: true, plus: "Le sonnet le plus célèbre du recueil. La nature protectrice et maternelle (« Nature, berce-le chaudement ») contraste avec la mort brutale. Toute la force tient dans la chute (le dernier vers) qui crée un choc : poème antimilitariste bâti sur l'euphémisme (dire « dort » au lieu de « mort »).", cite: "Il a deux trous rouges au côté droit." },
      { n: 18, t: "Au Cabaret-Vert", f: "sonnet", r: "Après des jours de marche, le poète savoure jambon, bière et le sourire d'une serveuse dans une auberge.", a: "Bonheur simple du vagabond : plaisir des sens et liberté de l'errance.", imp: true, plus: "La joie est physique : la faim, la fatigue, le corps heureux. Rimbaud fait de la poésie avec le trivial et le concret ; le vagabondage devient une forme d'émancipation joyeuse.", cite: "…des tartines / De beurre et du jambon tiède" },
      { n: 19, t: "La Maline", f: "sonnet", r: "Dans une auberge, une servante espiègle flirte avec le poète attablé.", a: "Scène de genre pleine de sensualité légère et de complicité." },
      { n: 20, t: "L'Éclatante Victoire de Sarrebrück", f: "sonnet", r: "Description ironique d'une gravure de propagande montrant Napoléon III en « vainqueur ».", a: "Satire de la propagande impériale et de l'empereur ridiculisé." },
      { n: 21, t: "Le Buffet", f: "sonnet", r: "Portrait d'un vieux buffet plein de linges, d'objets et de souvenirs anciens.", a: "Poésie des objets : le meuble devient mémoire du temps et du passé." },
      { n: 22, t: "Ma Bohème", f: "sonnet (« Fantaisie »)", r: "Le poète-vagabond marche sur les routes, pauvre mais libre, dort à la belle étoile et fait des rimes.", a: "Autoportrait du poète errant et heureux : la liberté et la création confondues.", imp: true, plus: "Poème qui clôt le recueil et le résume : Rimbaud est pauvre (« poches crevées ») mais totalement libre. La nature est sa maison (« Mon auberge était à la Grande-Ourse ») et marcher, c'est créer (« je rimais »). Le sonnet classique est détourné pour dire la liberté : c'est le manifeste de l'émancipation créatrice.", cite: "Je m'en allais, les poings dans mes poches crevées" }

        { sub: "La structure", text: "Roman d'abord publié en feuilleton (1882), en 18 chapitres, avec une quasi-unité de lieu : presque tout se passe dans l'immeuble." }

        { text: "Cœur de l'intrigue : les Josserand marient de force leur fille Berthe à Auguste Vabre — mariage arrangé, avec une dot promise mais jamais versée. Malheureuse, Berthe devient la maîtresse d'Octave. Scandale quand Auguste les surprend et que Berthe s'enfuit « en chemise » dans les étages." },
        { callout: "La fin (essentielle) : tout rentre dans l'ordre… des apparences. Berthe se réconcilie avec Auguste, Octave épouse la riche veuve Mme Hédouin, et un nouveau locataire arrive à qui le concierge vante « la moralité » de la maison. Le cycle recommence à l'identique." }
      ]},
      { id: "analyse", label: "Analyse de l'œuvre", couleur: C.rouge, blocks: [
        { sub: "Le projet", text: "Le vrai « héros » du roman n'est pas Octave, c'est l'immeuble — donc la bourgeoisie tout entière. Zola en fait une coupe, comme on coupe une maison en deux pour voir tous les étages en même temps. Son but : prouver que la respectabilité bourgeoise est une comédie, et que les vices qu'elle reproche au peuple (dans Nana, L'Assommoir) existent aussi chez les « honnêtes gens », mais cachés." },
        { sub: "Une construction en machine", text: "Presque tout se passe au même endroit (unité de lieu). Zola multiplie les intrigues parallèles : chaque appartement est un « cas ». Le lecteur circule sans cesse entre la façade et les coulisses. Et surtout, le roman est cyclique : la fin recopie le début (un nouveau locataire, le même discours). Ce cercle dit l'essentiel — rien ne se réforme, le système se reproduit." },
        { sub: "Un roman qui accuse sans juger", text: "Fidèle au naturalisme, Zola ne fait pas la morale : il installe un dispositif qui accuse tout seul. L'opposition des escaliers (grand escalier / escalier de service), le contrepoint des bonnes qui commentent, les corps malades : le lecteur voit, et conclut de lui-même." },

        { sub: "Ce qu'il faut avoir compris", text: "« Dévoiler les rouages », c'est montrer que ce qui fait tenir ce monde n'est pas la vertu affichée mais l'argent, le paraître et l'hypocrisie. Et qu'Octave réussit précisément parce qu'il joue ce jeu mieux que les autres." }
      ]},

        { sub: "Octave Mouret", text: "Le fil conducteur : ambitieux, séducteur, il veut réussir. Attention : ce n'est pas un héros moral, plutôt un « rouage » de plus — il joue le système mieux que les autres, et sa réussite finale est cynique." },
        { sub: "Les Josserand", text: "Mme Josserand, mère tyrannique obsédée par le mariage de ses filles (elle les « exhibe » comme des marchandises) ; M. Josserand, effacé, en meurt de honte ; Berthe, mariée de force ; Saturnin, le fils « fou »." },
        { sub: "Autour d'eux", items: [

      { id: "themes", label: "Thèmes", couleur: C.fuchsia, blocks: [
        { sub: "L'hypocrisie bourgeoise", text: "Le thème central : un décalage permanent entre la façade honnête et la réalité sordide. Tout le monde joue un rôle de respectabilité." },
        { sub: "L'argent et le mariage", text: "On se marie par intérêt, jamais par amour. Le mariage est un « marché » : dots, héritages, calculs. La famille Josserand en est l'exemple." },
        { sub: "Les domestiques", text: "L'envers de la maison. Depuis la cour et l'escalier de service, les bonnes voient tout et commentent crûment les turpitudes de leurs maîtres : c'est par elles que la vérité éclate." },
        { sub: "Le corps et les instincts", text: "Fidèle au naturalisme, Zola donne à chaque personnage une faiblesse physique (migraines, maladies, folie…) : les instincts et le corps gouvernent les êtres." }

        { sub: "« Dévoiler les rouages de la société »", text: "Zola ne raconte pas seulement des adultères : il démonte, pièce par pièce, la mécanique cachée d'un ordre social. Il montre comment l'argent, les apparences et l'hypocrisie font tourner la bourgeoisie." },
        { text: "Le romancier se fait « savant » : l'immeuble est son laboratoire. Le titre « pot-bouille » (la cuisine ordinaire) résume tout : sous les belles manières, une cuisine morale sordide — et le lecteur est invité à s'y reconnaître." }

        { sub: "Une construction sans intrigue", text: "Il n'y a pas d'histoire au sens classique : un seul mouvement, une dispute qui s'étire, se renverse et s'aggrave. L'arrivée du couple voisin introduit le regard du « sens commun », qui ne comprend rien et range tout dans des normes. La fin reste ouverte : c'est la rupture, sans réconciliation." },
        { sub: "Le pouvoir du dépouillement", text: "Pas de noms, pas de décor, pas d'époque : ce vide n'est pas un manque, c'est le procédé. Comme on n'a rien d'autre à quoi se raccrocher, on est forcé d'écouter les mots et leurs sous-entendus. Le spectateur devient une sorte d'enquêteur du non-dit." },

/* ═══════════════ MINI-DOM HELPERS ═══════════════ */
function el(tag, style, content) {
  var e = document.createElement(tag);
  if (style) { for (var k in style) { if (style.hasOwnProperty(k)) e.style[k] = style[k]; } }
  if (content != null) {
    if (typeof content === "string") e.textContent = content;
    else if (Array.isArray(content)) content.forEach(function (c) { if (c) e.appendChild(c); });
    else e.appendChild(content);
  }
  return e;
}
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

/* ═══════════════ PERSISTANCE (localStorage) ═══════════════ */
var STORE_KEY = "bacfr_state_v1";
function loadState() {
  try { var s = JSON.parse(localStorage.getItem(STORE_KEY)); return s && typeof s === "object" ? s : {}; }
  catch (e) { return {}; }
}
function saveState(patch) {
  try {
    var s = loadState();
    for (var k in patch) { if (patch.hasOwnProperty(k)) s[k] = patch[k]; }
    localStorage.setItem(STORE_KEY, JSON.stringify(s));
  } catch (e) { /* stockage indisponible : on ignore */ }
}

/* ═══════════════ COMPOSANTS UI ═══════════════ */
function cubeBtn(label, color, active, onClick, extra) {
  var b = el("button", {
    background: active ? color : "#fff",
    color: active ? onColor(color) : C.ink,
    border: "2px solid " + color,
    borderRadius: "15px",
    padding: "9px 15px",
    fontWeight: "600",
    fontSize: "14px",
    cursor: "pointer",
    boxShadow: active ? "0 4px 0 " + shade(color) : "0 3px 0 rgba(0,0,0,0.08)",
    transition: "transform .05s",
    whiteSpace: "nowrap"
  }, label);
  if (extra) { for (var k in extra) { if (extra.hasOwnProperty(k)) b.style[k] = extra[k]; } }
  b.addEventListener("click", onClick);
  b.addEventListener("touchstart", function () { b.style.transform = "translateY(2px)"; }, { passive: true });
  b.addEventListener("touchend", function () { b.style.transform = "translateY(0)"; });
  b.addEventListener("mousedown", function () { b.style.transform = "translateY(2px)"; });
  b.addEventListener("mouseup", function () { b.style.transform = "translateY(0)"; });
  b.addEventListener("mouseleave", function () { b.style.transform = "translateY(0)"; });
  return b;
}

function block(b, color) {
  if (b.cite) {
    var box = el("div", { borderLeft: "4px solid " + color, background: tint(color, "12"), borderRadius: "12px", padding: "12px 15px", margin: "11px 0" });
    box.appendChild(el("div", { fontStyle: "italic", fontWeight: "600", fontSize: "15.5px", color: C.ink }, "« " + b.cite + " »"));
    if (b.ref) box.appendChild(el("div", { fontSize: "12.5px", opacity: "0.7", marginTop: "4px", fontWeight: "600" }, b.ref));
    if (b.exp) box.appendChild(el("div", { fontSize: "13.8px", lineHeight: "1.5", marginTop: "7px", color: "#3a3f4f" }, b.exp));
    return box;
  }
  if (b.passage) {
    var p = el("div", { background: tint(color, "10"), borderRadius: "14px", padding: "13px 16px", margin: "11px 0" });
    p.appendChild(el("div", { fontWeight: "700", color: color, fontSize: "14.5px", marginBottom: "5px" }, b.passage));
    p.appendChild(el("p", { margin: "0", fontSize: "14.5px", lineHeight: "1.6", color: "#2A2E3D" }, b.text));
    return p;
  }
  if (b.callout) {
    return el("div", { background: "#FFF1F4", border: "1.5px solid #F7C6D2", borderRadius: "14px", padding: "13px 16px", margin: "12px 0", fontSize: "14.5px", lineHeight: "1.55" }, b.text);
  }
  if (b.note) {
    return el("div", { background: tint(C.jaune, "22"), borderRadius: "14px", padding: "12px 16px", margin: "12px 0", fontSize: "14px", lineHeight: "1.55" }, "💡 " + b.note);
  }
  var wrap = el("div", { margin: "11px 0" });
  if (b.sub) wrap.appendChild(el("div", { fontWeight: "700", fontSize: "15px", color: color, marginBottom: "6px" }, b.sub));
  if (b.text) wrap.appendChild(el("p", { margin: "0", fontSize: "14.7px", lineHeight: "1.62", color: "#2A2E3D" }, b.text));
  if (b.items) {
    var ul = el("ul", { margin: "6px 0 0", paddingLeft: "0", listStyle: "none" });
    b.items.forEach(function (it) {
      var li = el("li", { position: "relative", paddingLeft: "20px", margin: "7px 0", fontSize: "14.5px", lineHeight: "1.55", color: "#2A2E3D" }, it);
      li.appendChild(el("span", { position: "absolute", left: "0", top: "8px", width: "8px", height: "8px", borderRadius: "3px", background: color }));
      ul.appendChild(li);
    });
    wrap.appendChild(ul);
  }
  return wrap;
}

function card(color, extra) {
  var c = el("div", {
    background: "#fff", borderRadius: "18px", border: "2px solid " + color,
    boxShadow: "0 5px 0 " + tint(color, "33"), padding: "16px 18px"
  });
  if (extra) { for (var k in extra) { if (extra.hasOwnProperty(k)) c.style[k] = extra[k]; } }
  return c;
}

function chip(text, color) {
  return el("span", { fontSize: "12.5px", background: tint(color, "16"), color: shade(color), borderRadius: "8px", padding: "5px 10px", fontWeight: "600", display: "inline-block" }, text);
}
function chipRow(arr, color) {
  var d = el("div", { display: "flex", flexWrap: "wrap", gap: "7px" });

var root = document.getElementById("app");

function go(screen) {
  saveState({ screen: screen });
  window.scrollTo(0, 0);
  render(screen);
}

function render(screen) {
  clear(root);
  if (!screen || screen.type === "home") root.appendChild(Home());
  else if (screen.type === "oeuvre") root.appendChild(OeuvreView(findO(screen.id), screen.tab));
  else if (screen.type === "methode") root.appendChild(MethodeView());
  else if (screen.type === "fiches") root.appendChild(FicheView(screen.id));
  else root.appendChild(Home());
}
function findO(id) { for (var i = 0; i < OEUVRES.length; i++) if (OEUVRES[i].id === id) return OEUVRES[i]; return OEUVRES[0]; }

    container.appendChild(backBtn);
    var c = card(color);
    var tagRow = el("div", { display: "flex", alignItems: "center", gap: "8px", marginBottom: "6px", flexWrap: "wrap" });
    tagRow.appendChild(el("span", { background: color, color: onColor(color), borderRadius: "10px", padding: "3px 10px", fontWeight: "700", fontSize: "13px" }, "Poème " + p.n));
    if (p.imp) tagRow.appendChild(el("span", { background: tint(C.jaune, "33"), borderRadius: "10px", padding: "3px 10px", fontWeight: "700", fontSize: "12.5px", color: "#8a6d00" }, "⭐ Important"));
    c.appendChild(tagRow);
    c.appendChild(el("h3", { margin: "6px 0 2px", fontSize: "21px", color: C.ink }, p.t));
    c.appendChild(el("div", { fontSize: "12.5px", opacity: "0.65", marginBottom: "10px" }, p.f));
    c.appendChild(block({ sub: "Résumé", text: p.r }, color));
    c.appendChild(block({ sub: "Analyse", text: p.a }, color));
    if (p.plus) c.appendChild(block({ passage: "À retenir", text: p.plus }, color));
    if (p.cite) c.appendChild(block({ cite: p.cite, ref: p.t }, color));
    container.appendChild(c);
  }

  if (openN != null) showDetail(openN); else showList();
  return container;
}

/* ── Au bac ── */
function AuBac(a, color) {
  var wrap = el("div", { display: "flex", flexDirection: "column", gap: "14px" });

  var c1 = card(C.rouge);
  c1.appendChild(el("div", { fontWeight: "700", color: C.rouge, fontSize: "15px", marginBottom: "8px" }, "Sujets de dissertation probables"));
  a.sujets.forEach(function (s, i) {
    var row = el("div", { display: "flex", gap: "9px", margin: "8px 0", fontSize: "14.3px", lineHeight: "1.5" });
    row.appendChild(el("span", { flex: "0 0 22px", height: "22px", borderRadius: "7px", background: tint(C.rouge, "1F"), color: shade(C.rouge), fontWeight: "700", fontSize: "12.5px", display: "flex", alignItems: "center", justifyContent: "center" }, String(i + 1)));
    row.appendChild(el("span", { color: "#2A2E3D" }, s));
    c1.appendChild(row);
  });
  wrap.appendChild(c1);

  var c2 = card(color);
  c2.appendChild(el("div", { fontWeight: "700", color: color, fontSize: "15px", marginBottom: "8px" }, a.plan.titre));
  a.plan.parties.forEach(function (pp) {
    var d = el("div", { margin: "9px 0" });
    d.appendChild(el("div", { fontWeight: "700", fontSize: "14.3px", color: C.ink }, pp[0]));
    d.appendChild(el("div", { fontSize: "14px", lineHeight: "1.5", color: "#3a3f4f", marginTop: "2px" }, pp[1]));
    c2.appendChild(d);
  });
  wrap.appendChild(c2);

  var c3 = card(C.violet);
  c3.appendChild(el("div", { fontWeight: "700", color: C.violet, fontSize: "15px", marginBottom: "4px" }, "Questions d'oral (entretien)"));
  c3.appendChild(block({ items: a.oral }, C.violet));
  wrap.appendChild(c3);

  var c4 = card(C.turquoise);
  c4.appendChild(el("div", { fontWeight: "700", color: C.turquoise, fontSize: "15px", marginBottom: "4px" }, "Ouvertures & liens"));
  c4.appendChild(block({ items: a.ouvertures }, C.turquoise));
  wrap.appendChild(c4);

  var pg = el("div", { background: "#FFF1F4", border: "1.5px solid #F7C6D2", borderRadius: "14px", padding: "13px 16px", fontSize: "14.3px", lineHeight: "1.55" });
  pg.appendChild(el("span", { fontWeight: "700" }, "⚠️ Piège à éviter — "));
  pg.appendChild(document.createTextNode(a.piege));
  wrap.appendChild(pg);
  return wrap;
}

/* ── Méthode ── */
function MethodeView() {
  var wrap = el("div");
  var st = loadState();
  var idx = typeof st.methode === "number" ? st.methode : 0;
  wrap.appendChild(cubeBtn("← Accueil", C.ink, false, function () { go({ type: "home" }); }, { marginBottom: "16px" }));
  wrap.appendChild(el("h2", { fontSize: "22px", color: C.ink, margin: "0 0 12px" }, "📝 Méthode bac"));
  var tabRow = el("div", { display: "flex", gap: "8px", overflowX: "auto", paddingBottom: "14px" });
  tabRow.className = "row-scroll";
  var body = el("div");
  function draw() {
    clear(tabRow);
    METHODE.forEach(function (m, k) {
      var holder = el("div", { flex: "0 0 auto" });
      holder.appendChild(cubeBtn(m.label, m.couleur, idx === k, function () { idx = k; saveState({ methode: k }); draw(); }));
      tabRow.appendChild(holder);
    });
    clear(body);
    var m = METHODE[idx];
    var c = card(m.couleur);
    m.blocks.forEach(function (b) { c.appendChild(block(b, m.couleur)); });
    body.appendChild(c);
  }
  wrap.appendChild(tabRow);
  wrap.appendChild(body);
  draw();
  return wrap;
}

/* ── Fiches ── */
function fsection(title, color, contentNode) {
  var s = el("div", { marginTop: "14px", paddingTop: "12px", borderTop: "1px solid #F0EEE8" });
  s.appendChild(el("div", { fontSize: "11.5px", fontWeight: "800", letterSpacing: "0.5px", color: color, textTransform: "uppercase", marginBottom: "8px" }, title));
  s.appendChild(contentNode);
  return s;
}
function FicheView(startId) {
  var wrap = el("div");
  var st = loadState();
  var id = startId || st.fiche || OEUVRES[0].id;
  wrap.appendChild(cubeBtn("← Accueil", C.ink, false, function () { go({ type: "home" }); }, { marginBottom: "14px" }));
  wrap.appendChild(el("h2", { fontSize: "22px", color: C.ink, margin: "0 0 4px" }, "🗂️ Fiches essentielles"));
  wrap.appendChild(el("p", { fontSize: "13.5px", opacity: "0.7", marginTop: "0" }, "Tout l'essentiel d'une œuvre sur une seule fiche."));
  var tabRow = el("div", { display: "flex", gap: "8px", overflowX: "auto", paddingBottom: "14px" });
  tabRow.className = "row-scroll";
  var body = el("div");

  function lastName(auteur) { var parts = auteur.split(" "); return parts[parts.length - 1]; }

  function draw() {
    saveState({ fiche: id });
    clear(tabRow);
    OEUVRES.forEach(function (x) {
      var holder = el("div", { flex: "0 0 auto" });
      holder.appendChild(cubeBtn(lastName(x.auteur), x.couleur, id === x.id, function () { id = x.id; window.scrollTo(0, 0); draw(); }));
      tabRow.appendChild(holder);
    });
    clear(body);
    var o = findO(id);
    var f = o.fiche;
    var col = o.couleur;
    var c = card(col, { borderTop: "8px solid " + col });
    c.appendChild(el("h3", { margin: "0", fontSize: "20px", color: C.ink, lineHeight: "1.2" }, o.titre));
    c.appendChild(el("div", { fontSize: "14px", fontWeight: "600", color: col, marginTop: "3px" }, o.auteur + " · " + o.petit));
    c.appendChild(el("div", { marginTop: "8px", display: "inline-block", background: tint(col, "1A"), color: shade(col), borderRadius: "8px", padding: "4px 10px", fontSize: "12.5px", fontWeight: "700" }, "🎯 " + o.parcours));

    c.appendChild(fsection("En bref", col, el("p", { margin: "0", fontSize: "14.3px", lineHeight: "1.55", color: "#2A2E3D" }, f.express)));
    c.appendChild(fsection("À retenir", col, el("div", { background: tint(col, "12"), borderRadius: "12px", padding: "11px 14px", fontSize: "14.3px", lineHeight: "1.55", color: "#2A2E3D" }, f.retenir)));
    c.appendChild(fsection("Repères", col, chipRow(f.reperes, col)));
    c.appendChild(fsection("Thèmes clés", col, chipRow(f.themes, col)));

    if (f.perso) {
      var ul = el("ul", { margin: "0", paddingLeft: "0", listStyle: "none" });
      f.perso.forEach(function (r) {
        var li = el("li", { position: "relative", paddingLeft: "18px", margin: "5px 0", fontSize: "13.8px", lineHeight: "1.45", color: "#2A2E3D" }, r);
        li.appendChild(el("span", { position: "absolute", left: "0", top: "7px", width: "7px", height: "7px", borderRadius: "2px", background: col }));
        ul.appendChild(li);
      });
      c.appendChild(fsection("Personnages & notions", col, ul));
    }
    if (f.poemes) c.appendChild(fsection("Poèmes incontournables", col, chipRow(f.poemes, col)));

    var citWrap = el("div");
    f.citations.forEach(function (ci) {
      var d = el("div", { margin: "6px 0", paddingLeft: "10px", borderLeft: "3px solid " + tint(col, "55") });
      d.appendChild(el("span", { fontStyle: "italic", fontSize: "13.8px", color: C.ink }, "« " + ci.q + " »"));
      d.appendChild(el("span", { fontSize: "11.5px", opacity: "0.6", marginLeft: "6px" }, ci.r));
      citWrap.appendChild(d);
    });
    c.appendChild(fsection("Citations", col, citWrap));

    if (f.piege) c.appendChild(fsection("Piège à éviter", col, el("div", { background: "#FFF1F4", border: "1.5px solid #F7C6D2", borderRadius: "12px", padding: "10px 13px", fontSize: "13.8px", lineHeight: "1.5" }, "⚠️ " + f.piege)));
    c.appendChild(fsection("Ouverture", col, chipRow(f.ouverture, col)));
    body.appendChild(c);
  }

  wrap.appendChild(tabRow);
  wrap.appendChild(body);
  draw();
  return wrap;
}

/* ═══════════════ DÉMARRAGE ═══════════════ */
(function start() {
  var st = loadState();
  var screen = st.screen && st.screen.type ? st.screen : { type: "home" };
  render(screen);
})();
</script>
